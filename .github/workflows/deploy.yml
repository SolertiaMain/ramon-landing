name: Deploy Ramon Landing

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Ejecutar deploy por SSH
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ vars.HOST }}
          username: ${{ vars.USERNAME }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            sudo /root/scripts/deploy-ramon.sh